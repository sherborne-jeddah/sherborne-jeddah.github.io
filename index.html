<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CCA Planner</title>
<meta name="description" content="Club timetable planner for Sherborne School Jeddah">
<meta name="theme-color" content="#0E6B5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CCA Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar with view tabs; one working view at a time; edit drawer slides in from the right. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E8ECEA; --line:#D5DCD9; --ink:#15211E; --muted:#5B6B66;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#D7EEE8; --mark:#F2B233;
  --warn:#B4550B; --warn-soft:#FCE9D6; --bad:#B42318; --bad-soft:#FBE3E0; --good:#1E7A3C; --good-soft:#DDF2E2;
  --d-sun:#D2543E; --d-mon:#2E6FD8; --d-tue:#7A4CC2; --d-wed:#1F8A5B; --d-thu:#C9861A;
  --d-sun-s:#FBE4DE; --d-mon-s:#DFE9FB; --d-tue-s:#ECE3F8; --d-wed-s:#DCF1E6; --d-thu-s:#F8EBD3;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --shadow:0 8px 30px rgba(10,30,25,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#16201D; --sunk:#1D2925; --line:#2B3A35; --ink:#E6EEEB; --muted:#93A6A0;
  --accent:#4CC3A8; --accent-ink:#06231D; --accent-soft:#183A33; --mark:#F2B233;
  --warn:#F0A060; --warn-soft:#3A2614; --bad:#F2877A; --bad-soft:#3A1A17; --good:#6FD08F; --good-soft:#163222;
  --d-sun:#F08670; --d-mon:#7FA9F2; --d-tue:#B596EA; --d-wed:#6ACB9C; --d-thu:#E9B45A;
  --d-sun-s:#3A211C; --d-mon-s:#1C2A44; --d-tue-s:#2B2140; --d-wed-s:#163126; --d-thu-s:#3A2C14;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#16201D; --sunk:#1D2925; --line:#2B3A35; --ink:#E6EEEB; --muted:#93A6A0;
  --accent:#4CC3A8; --accent-ink:#06231D; --accent-soft:#183A33; --mark:#F2B233;
  --warn:#F0A060; --warn-soft:#3A2614; --bad:#F2877A; --bad-soft:#3A1A17; --good:#6FD08F; --good-soft:#163222;
  --d-sun:#F08670; --d-mon:#7FA9F2; --d-tue:#B596EA; --d-wed:#6ACB9C; --d-thu:#E9B45A;
  --d-sun-s:#3A211C; --d-mon-s:#1C2A44; --d-tue-s:#2B2140; --d-wed-s:#163126; --d-thu-s:#3A2C14;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand .crest{width:44px;height:auto;flex:none}
.brand .wordmark{width:128px;height:auto;flex:none}
.brand .sep{width:1px;align-self:stretch;background:var(--line);margin-block:4px}
.brand .titles{display:flex;flex-direction:column;min-width:0}
.brand h1{line-height:1.1}
@media (max-width:720px){.brand .wordmark,.brand .sep{display:none}}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.brand .season{color:var(--muted);font-size:12.5px;white-space:nowrap}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;opacity:0}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:hover{color:var(--ink)}
main{padding-block:22px 60px}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.viewhead h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0;text-wrap:balance;letter-spacing:-.01em}
.viewhead p{margin:4px 0 0;color:var(--muted)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);margin-bottom:16px;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .n{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi.alert .n{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h3{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 12px}
.panel+.panel{margin-top:18px}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.ks{background:var(--accent-soft);color:var(--accent)}
.day{font-weight:700;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px}
.day.Sun{background:var(--d-sun-s);color:var(--d-sun)}.day.Mon{background:var(--d-mon-s);color:var(--d-mon)}
.day.Tue{background:var(--d-tue-s);color:var(--d-tue)}.day.Wed{background:var(--d-wed-s);color:var(--d-wed)}
.day.Thu{background:var(--d-thu-s);color:var(--d-thu)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:44px minmax(0,1fr) 92px;align-items:center;gap:10px}
.track{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.fill{height:100%;border-radius:6px}
.fill.Sun{background:var(--d-sun)}.fill.Mon{background:var(--d-mon)}.fill.Tue{background:var(--d-tue)}.fill.Wed{background:var(--d-wed)}.fill.Thu{background:var(--d-thu)}
.list{display:flex;flex-direction:column}
.list .row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.list .row:first-child{border-top:0}
.list .row:hover{background:var(--sunk)}
.list .row .name{font-weight:600;min-width:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--sunk);position:sticky;top:0;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .arr{opacity:.7}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select.f,input.f{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h4{margin:0;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:13px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.missing{color:var(--warn);font-style:italic}
.cap{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.cap i{display:block;height:100%;background:var(--accent)}
.cap i.over{background:var(--bad)}
details.roster summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:13px}
details.roster ol{margin:8px 0 0;padding-left:22px;columns:2;column-gap:18px;font-size:13px}
details.roster li{break-inside:avoid}
@media (max-width:480px){details.roster ol{columns:1}}
.classpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.classpick button{padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-weight:600;cursor:pointer}
.classpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot{width:100%;min-width:150px;max-width:230px;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.slot.empty{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:600}
.slottxt{font-size:13px}
.slottxt.empty{color:var(--warn);font-weight:600}
td.stu{font-weight:600;white-space:nowrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on.Sun{background:var(--d-sun)}.dots i.on.Mon{background:var(--d-mon)}.dots i.on.Tue{background:var(--d-tue)}.dots i.on.Wed{background:var(--d-wed)}.dots i.on.Thu{background:var(--d-thu)}
.locin{width:100%;min-width:140px;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent}
.locin:hover{border-color:var(--line)}
.locin:focus{border-color:var(--accent);background:var(--surface)}
.locin.blank{background:var(--warn-soft)}
.locin:disabled{opacity:1}
.dayhead{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.dayhead:first-of-type{margin-top:0}
.dayhead h3{margin:0;font-family:var(--display);font-weight:600;font-size:19px}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty-state strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dhead h3{margin:0;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.2}
.dbody{padding:16px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.dfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dayslots{display:flex;flex-direction:column;gap:8px}
.dayslots .ds{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:8px}
.dayslots select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.dayslots select.empty{border-color:var(--warn);background:var(--warn-soft)}
.confirm{padding:12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);display:flex;flex-direction:column;gap:8px}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.rosteredit{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px}
.rosteredit .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line)}
.rosteredit .r:first-child{border-top:0}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.linkbtn.rm{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
.legend{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
.attbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.attbar input[type=date]{font-size:16px;min-width:180px}
button.regcard{text-align:left;cursor:pointer;font:inherit;color:inherit}
button.regcard:hover{background:var(--sunk)}
.reglist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.regrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;min-height:52px}
.regrow:first-child{border-top:0}
.regrow .regst{font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--good-soft);color:var(--good);flex:none}
.regrow.abs{background:var(--bad-soft)}
.regrow.abs .regst{background:var(--bad);color:#fff}
@media (max-width:560px){.brand h1{font-size:19px}.viewhead h2{font-size:22px}.two{grid-template-columns:1fr}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">

const DAYS = ["Sun","Mon","Tue","Wed","Thu"];
const DAYFULL = {Sun:"Sunday",Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday"};
const S = {
  view:"overview", clubs:new Map(), students:new Map(), loaded:{c:false,s:false},
  db:null, canWrite:true, dl:null, noDb:false,
  dayTab:"Sun", dayStage:"all", clubSort:{k:"day",d:1}, clubDay:"all", clubStage:"all", clubQ:"",
  cls:null, stuQ:"", stuCls:"all", stuSort:{k:"name",d:1}, stuOnlyGaps:false, locMissing:false, locDay:"all"
};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yearOf = cls => parseInt(String(cls),10) || 0;
const full = s => `${s.first} ${s.last}`.trim();
const dayIdx = d => DAYS.indexOf(d);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- derived ---------- */
function rosters(){
  const r = new Map(); S.clubs.forEach((c,id)=>r.set(id,[]));
  S.students.forEach((s,sid)=>{ DAYS.forEach(d=>{ const cid=s.slots?.[d]; if(cid&&r.has(cid)) r.get(cid).push(sid); }); });
  r.forEach(list=>list.sort((a,b)=>cmpStu(S.students.get(a),S.students.get(b))));
  return r;
}
function cmpStu(a,b){ return a.cls.localeCompare(b.cls,undefined,{numeric:true}) || full(a).localeCompare(full(b)); }
function classes(){ return [...new Set([...S.students.values()].map(s=>s.cls))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})); }
function filled(s){ return DAYS.filter(d=>s.slots?.[d] && S.clubs.has(s.slots[d])).length; }
function clubsSorted(list){ return list.sort((a,b)=>dayIdx(a[1].day)-dayIdx(b[1].day) || Math.min(...a[1].years)-Math.min(...b[1].years) || a[1].name.localeCompare(b[1].name)); }
function clubLabel(c){ return c ? c.name : ""; }
function dayChip(d){ return `<span class="day ${d}">${d}</span>`; }
function stageOf(c){ const hi=Math.max(...c.years), lo=Math.min(...c.years); return hi<=3?"KS1":(lo>=3?"KS2/3":"Mixed"); }
function stageMatch(c,st){ if(st==="all") return true; const s=stageOf(c); return st==="KS1" ? s==="KS1" : s!=="KS1"; }

/* ---------- routing ---------- */
function setView(v){
  if(!["overview","attendance","report","days","clubs","classes","students","locations"].includes(v)) v="overview";
  S.view=v; document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.v===v?"page":"false"));
  render(); window.scrollTo({top:0});
}
window.addEventListener("hashchange",()=>setView(location.hash.slice(1)));
$("#gsearch").addEventListener("input",e=>{ S.stuQ=e.target.value; if(S.view!=="students"){ location.hash="students"; } else render(); });

/* ---------- render ---------- */
function render(){
  const m=$("#main");
  if(S.noDb){ m.innerHTML=`<div class="empty-state"><strong>Club data can't load.</strong>Check your internet connection, then reopen the app.</div>`; return; }
  if(!(S.loaded.c&&S.loaded.s)) return;
  if(!S.clubs.size){ m.innerHTML=`<div class="viewhead"><div><h2>No clubs yet</h2><p>Add the first club to start building the timetable.</p></div>${S.canWrite?`<button class="btn primary" data-act="newclub">Add club</button>`:""}</div>`; return; }
  const ro = S.canWrite || S.view==="attendance" || S.view==="report" ? "" : `<div class="banner">You can view the timetable but not change it. Ask the CCA coordinator for edit access.</div>`;
  const keepFocus = document.activeElement && document.activeElement.id; const caret = document.activeElement?.selectionStart;
  m.innerHTML = ro + ({overview:vOverview,attendance:vAttendance,report:vReport,days:vDays,clubs:vClubs,classes:vClasses,students:vStudents,locations:vLocations}[S.view])();
  if(keepFocus){ const el=document.getElementById(keepFocus); if(el&&el.id!=="gsearch"){ el.focus(); try{ if(caret!=null) el.setSelectionRange(caret,caret);}catch(e){} } }
}

function vOverview(){
  const R=rosters(), studs=[...S.students.entries()], tot=studs.length;
  const placed=studs.reduce((a,[,s])=>a+filled(s),0);
  const gaps=studs.filter(([,s])=>filled(s)<5).sort((a,b)=>filled(a[1])-filled(b[1])||cmpStu(a[1],b[1]));
  const noLoc=clubsSorted([...S.clubs.entries()].filter(([,c])=>!c.location));
  const noTA=[...S.clubs.values()].filter(c=>!c.ta).length;
  const over=clubsSorted([...S.clubs.entries()].filter(([id,c])=>c.capacity && R.get(id).length>c.capacity));
  const perDay=DAYS.map(d=>({d,n:studs.filter(([,s])=>s.slots?.[d]&&S.clubs.has(s.slots[d])).length,c:[...S.clubs.values()].filter(c=>c.day===d).length}));
  const cls=classes().map(c=>{const ss=studs.filter(([,s])=>s.cls===c).map(x=>x[1]); return {c,n:ss.length,full:ss.filter(s=>filled(s)===5).length};});
  return `
  <div class="viewhead"><div><h2>Overview</h2><p>Where things stand across the whole programme, and what still needs sorting.</p></div></div>
  <div class="kpis">
    <div class="kpi"><div class="n">${tot}</div><div class="l">Students</div></div>
    <div class="kpi"><div class="n">${S.clubs.size}</div><div class="l">Club sessions</div></div>
    <div class="kpi"><div class="n">${placed}</div><div class="l">Places filled</div></div>
    <div class="kpi ${gaps.length?"alert":""}"><div class="n">${gaps.length}</div><div class="l">Students with free days</div></div>
    <div class="kpi ${noLoc.length?"alert":""}"><div class="n">${noLoc.length}</div><div class="l">Clubs without a room</div></div>
    <div class="kpi ${noTA?"alert":""}"><div class="n">${noTA}</div><div class="l">Clubs without a TA</div></div>
  </div>
  <div class="grid2">
    <div>
      <div class="panel"><h3>Students with free days <span class="muted" style="font-weight:400;font-size:14px">· ${gaps.length}</span></h3>
        ${gaps.length?`<div class="list">${gaps.map(([id,s])=>`<div class="row" data-stu="${esc(id)}" tabindex="0"><span class="name">${esc(full(s))}</span><span class="chip">${esc(s.cls)}</span><span style="margin-left:auto;display:flex;gap:4px;flex-wrap:wrap">${DAYS.filter(d=>!(s.slots?.[d]&&S.clubs.has(s.slots[d]))).map(d=>`<span class="day ${d}">no ${d}</span>`).join("")}</span></div>`).join("")}</div>`:`<p class="muted">Every student has a club on all five days.</p>`}
      </div>
      ${over.length?`<div class="panel"><h3>Over capacity</h3><div class="list">${over.map(([id,c])=>`<div class="row" data-club="${esc(id)}" tabindex="0">${dayChip(c.day)}<span class="name">${esc(c.name)}</span><span class="muted">${esc(c.yearsLabel)}</span><span class="chip bad" style="margin-left:auto">${R.get(id).length}/${c.capacity}</span></div>`).join("")}</div></div>`:""}
    </div>
    <div>

function sortHead(key,label,cur,num){ const on=cur.k===key; return `<th class="sortable ${num?"num":""}" data-sort="${key}" aria-sort="${on?(cur.d>0?"ascending":"descending"):"none"}">${label} <span class="arr">${on?(cur.d>0?"▲":"▼"):""}</span></th>`; }

/* ---------- writes ---------- */
function toast(msg){ const t=$("#toastRoot"); t.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>t.innerHTML="",2400); }
async function write(fn,ok){
  if(!S.db||!S.canWrite) return false;
  try{ await fn(); if(ok) toast(ok); return true; }
  catch(e){
    if(e&&e.code==="invalid_argument"){ S.canWrite=false; render(); toast("You don't have permission to edit this timetable."); }
    else if(e&&e.code==="quota_exceeded") toast("The timetable is full. Remove unused records, then try again.");
    else toast("That change didn't save. Check your connection and try again.");
    return false;
  }
}
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80) || "x";
function yearsLabel(arr){ const lo=Math.min(...arr),hi=Math.max(...arr); if(lo===hi) return `Year ${lo}`; const contiguous=arr.length===hi-lo+1; return contiguous?`Years ${lo}-${hi}`:"Years "+arr.join(" & "); }

async function setSlot(sid,day,cid){
  const s=S.students.get(sid); if(!s) return;
  const c=S.clubs.get(cid);
  await write(()=>S.db.doc(`students/${sid}`).update({slots:{[day]:cid||null}}), c?`${s.first} moved to ${c.name} on ${DAYFULL[day]}`:`${s.first} has no club on ${DAYFULL[day]} now`);
}

async function saveStudent(){
  const first=$("#f_first").value.trim(), last=$("#f_last").value.trim(), cls=$("#f_cls").value.trim().toUpperCase().replace(/^CLASS\s*/,"");
  if(!first||!last||!cls){ toast("Add a first name, surname and class."); return; }
  const slots={}; document.querySelectorAll(".dayslots select").forEach(el=>slots[el.dataset.day]=el.value||null);
  const notes=$("#f_notes").value.trim();
  if(drawer.isNew){
    const id=`${slugify(first+"-"+last)}-${slugify(cls)}-${Date.now().toString(36)}`;
    if(await write(()=>S.db.doc(`students/${id}`).set({first,last,cls,slots,notes}),`${first} ${last} added to ${cls}`)) closeDrawer();
  } else {
    if(await write(()=>S.db.doc(`students/${drawer.sid}`).update({first,last,cls,slots,notes}),"Student saved")) closeDrawer();
  }
}
async function saveClub(){
  const name=$("#c_name").value.trim(); if(!name){ toast("Give the club a name."); return; }
  let lo=+$("#c_lo").value, hi=+$("#c_hi").value; if(lo>hi) [lo,hi]=[hi,lo];
  const old=drawer.isNew?null:S.clubs.get(drawer.cid);
  const contiguous=old&&old.years.length===Math.max(...old.years)-Math.min(...old.years)+1;
  const years = (old && !contiguous && lo===Math.min(...old.years) && hi===Math.max(...old.years)) ? old.years : Array.from({length:hi-lo+1},(_,i)=>lo+i);
  const capV=$("#c_cap").value.trim();
  const data={name,day:$("#c_day").value,years,yearsLabel:yearsLabel(years),teacher:$("#c_teacher").value.trim(),ta:$("#c_ta").value.trim(),location:$("#c_loc").value.trim(),capacity:capV?Math.max(1,parseInt(capV,10)):null,notes:$("#c_notes").value.trim(),stage:hi<=3?"KS1":(lo>=3?"KS2/3":"Mixed")};
  if(drawer.isNew){
    const id=`${slugify(name)}-${data.day.toLowerCase()}-y${lo}${hi}-${Date.now().toString(36)}`;
    if(await write(()=>S.db.doc(`clubs/${id}`).set(data),`${name} added on ${DAYFULL[data.day]}`)) closeDrawer();
  } else {
    if(old.day!==data.day && rosters().get(drawer.cid).length){ toast("Move this club's students first, or keep it on "+DAYFULL[old.day]+"."); return; }
    if(await write(()=>S.db.doc(`clubs/${drawer.cid}`).update(data),"Club saved")) closeDrawer();
  }
}

  if(t.dataset.sort){ const o=S.view==="clubs"?S.clubSort:S.stuSort; if(o.k===t.dataset.sort) o.d*=-1; else {o.k=t.dataset.sort;o.d=t.dataset.sort==="count"?-1:1;} render(); return; }

  if(t.dataset.gocls){ S.cls=t.dataset.gocls; location.hash="classes"; return; }
  if(t.dataset.rmstu){ e.preventDefault(); const cid=drawer.cid, day=S.clubs.get(cid).day; await setSlot(t.dataset.rmstu,day,null); clubDrawer(cid); return; }

/* ---------- attendance: registers and absence report ---------- */
// One register per club session per date: registers/<yyyy-mm-dd>__<club id>.
// It keeps a copy of the names, so reports still read correctly if a student or club is later removed.
const SEASON_START = "2026-10-25";
const pad2 = n => String(n).padStart(2,"0");
const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const dateObj = iso => new Date(iso+"T12:00:00");
const dayOfISO = iso => ["Sun","Mon","Tue","Wed","Thu",null,null][dateObj(iso).getDay()];
const fmtDate = iso => dateObj(iso).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const fmtShort = iso => dateObj(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const regId = (iso,cid) => `${iso}__${cid}`;
const addDays = (iso,n) => { const d=dateObj(iso); d.setDate(d.getDate()+n); return isoOf(d); };
S.regs = new Map();
S.attDate = todayISO(); S.attDateSet = false; S.attQ = "";
S.rep = {from:SEASON_START, to:todayISO(), cls:"all", club:"all", preset:"season"};
// The register date follows the calendar: reopening the app on a new day starts on that day,
// unless the teacher picked a different date themselves.
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && !S.attDateSet && S.attDate!==todayISO()){ S.attDate=todayISO(); if(S.view==="attendance") render(); } });

async function writeReg(fn,ok){
  if(!S.db) return false;
  try{ await fn(); if(ok) toast(ok); return true; }
  catch(e){ toast(e&&e.code==="invalid_argument"?"You need to sign in again to save registers.":"The register didn't save. Check your connection and try again."); return false; }
}

  </div>`;
  const head=`<div class="viewhead"><div><h2>Attendance</h2><p>${fmtDate(iso)}${isToday?" · today":""}. Tap a club, mark who is absent, then save.</p></div></div>`;
  if(!d) return head+picker+`<div class="empty-state"><strong>No clubs on ${dateObj(iso).toLocaleDateString("en-GB",{weekday:"long"})}s.</strong>Pick a school day (Sunday to Thursday) above.</div>`;
  const q=S.attQ.trim().toLowerCase();
  const list=clubsSorted([...S.clubs.entries()].filter(([,c])=>c.day===d))
    .filter(([,c])=>!q||[c.name,c.teacher,c.ta,c.location].join(" ").toLowerCase().includes(q));

  const taken=[...S.clubs.entries()].filter(([id,c])=>c.day===d&&S.regs.has(regId(iso,id))).length;
  const absToday=[...S.regs.values()].filter(r=>r.date===iso).reduce((a,r)=>a+(r.absent||[]).length,0);
  return head+picker+`

  </div>
  <div class="filters"><input class="f" id="attQ" type="search" placeholder="Find your club, name or room…" value="${esc(S.attQ)}" aria-label="Find a club" style="flex:1 1 220px"></div>
  <div class="cards">${list.map(([id,c])=>{
    const r=S.regs.get(regId(iso,id)), n=R.get(id).length, ab=r?(r.absent||[]).length:0;
    return `<button class="card regcard" data-act="openreg" data-cid="${esc(id)}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h4>${esc(c.name)}</h4>${r?`<span class="chip ${ab?"bad":"good"}">${ab?ab+" absent":"All present"}</span>`:`<span class="chip warn">Not taken</span>`}</div>
      <div class="muted" style="font-size:13px">${esc(c.yearsLabel)} · ${n} students${c.teacher?` · ${esc(c.teacher)}`:""}${c.location?` · ${esc(c.location)}`:""}</div>
      ${r?`<div class="muted" style="font-size:12px">Saved ${new Date(r.at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}${r.by?` by ${esc(r.by)}`:""}</div>`:""}
    </button>`;}).join("")||`<div class="empty-state"><strong>No clubs match.</strong>Clear the search to see every ${DAYFULL[d]} club.</div>`}</div>`;
}

function regDrawer(cid){
  const c=S.clubs.get(cid); if(!c) return;
  const iso=S.attDate, r=S.regs.get(regId(iso,cid));
  // Students come from the saved register if there is one (so old registers stay as they were), else from today's roster.
  const roster=rosters().get(cid).map(sid=>{const s=S.students.get(sid); return {id:sid,name:full(s),cls:s.cls};});
  const students = r ? [...(r.students||[]), ...roster.filter(x=>!(r.students||[]).some(y=>y.id===x.id))] : roster;
  drawer={type:"reg",cid,iso,students,absent:new Set((r?.absent||[]).map(a=>a.id))};
  openDrawer(`<div class="dhead"><div><div class="muted" style="font-size:12.5px;font-weight:600">${fmtDate(iso)} · ${esc(c.yearsLabel)}</div><h3>${esc(c.name)}</h3></div><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="dbody">
    <p class="muted" style="margin:0">${r?`Taken ${new Date(r.at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}${r.by?` by ${esc(r.by)}`:""}. Change it and save again if needed.`:"Everyone starts as present. Tap a student to mark them absent."}</p>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><strong id="regCount"></strong><button class="linkbtn" data-act="allpresent">Mark all present</button></div>
    <div class="reglist" id="regList">${students.length?students.map(s=>`<button type="button" class="regrow" data-act="toggleabs" data-sid="${esc(s.id)}" aria-pressed="false"><span><strong>${esc(s.name)}</strong> <span class="muted">${esc(s.cls)}</span></span><span class="regst"></span></button>`).join(""):`<div class="empty-state">No students in this club.</div>`}</div>
  </div>
  <div class="dfoot"><span></span><div style="display:flex;gap:8px"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="savereg">Save register</button></div></div>`);
  paintReg();
}
function paintReg(){
  if(!drawer||drawer.type!=="reg") return;
  document.querySelectorAll("#regList .regrow").forEach(b=>{ const ab=drawer.absent.has(b.dataset.sid); b.setAttribute("aria-pressed",ab?"true":"false"); b.classList.toggle("abs",ab); b.querySelector(".regst").textContent=ab?"Absent":"Present"; });
  const n=drawer.absent.size, t=drawer.students.length; const el=$("#regCount"); if(el) el.textContent=`${t-n} present · ${n} absent`;
}
async function saveReg(){
  const {cid,iso,students,absent}=drawer, c=S.clubs.get(cid);
  const data={date:iso,day:dayOfISO(iso),club:cid,clubName:c.name,yearsLabel:c.yearsLabel||"",teacher:c.teacher||"",location:c.location||"",
    students, absent:students.filter(s=>absent.has(s.id)), by:window.CCA_USER_EMAIL||"", at:new Date().toISOString()};
  const btn=document.querySelector('[data-act="savereg"]'); if(btn){btn.disabled=true;btn.textContent="Saving…";}
  if(await writeReg(()=>S.db.doc(`registers/${regId(iso,cid)}`).set(data),`${c.name}: ${absent.size?absent.size+" absent":"all present"} · saved`)) closeDrawer();
  else if(btn){btn.disabled=false;btn.textContent="Save register";}
}

/* ---- report ---- */
function repPreset(p){
  const t=todayISO(), d=dateObj(t);
  if(p==="today") return [t,t];
  if(p==="week"){ return [addDays(t,-d.getDay()),t]; }              // week starts Sunday
  if(p==="month") return [`${t.slice(0,8)}01`,t];
  return [SEASON_START,t];
}
function reportData(){
  const {from,to,cls,club}=S.rep;
  const regs=[...S.regs.values()].filter(r=>r.date>=from&&r.date<=to&&(club==="all"||r.club===club)).sort((a,b)=>a.date.localeCompare(b.date)||a.clubName.localeCompare(b.clubName));
  const rows=[]; regs.forEach(r=>(r.absent||[]).forEach(a=>{ if(cls==="all"||a.cls===cls) rows.push({date:r.date,day:r.day,name:a.name,cls:a.cls,id:a.id,club:r.clubName,teacher:r.teacher,by:r.by}); }));
  const by=new Map(); rows.forEach(x=>{ const k=x.id; if(!by.has(k)) by.set(k,{name:x.name,cls:x.cls,n:0,dates:[]}); const o=by.get(k); o.n++; o.dates.push(`${fmtShort(x.date)} (${x.club})`); });
  const per=[...by.values()].sort((a,b)=>b.n-a.n||a.cls.localeCompare(b.cls,undefined,{numeric:true})||a.name.localeCompare(b.name));
  let places=0; regs.forEach(r=>{ places+=(r.students||[]).filter(s=>cls==="all"||s.cls===cls).length; });
  // Sessions that should have had a register (school days up to today) but don't.
  const missing=[]; const end=to<todayISO()?to:todayISO();
  for(let d=from; d<=end; d=addDays(d,1)){ const dd=dayOfISO(d); if(!dd) continue;
    S.clubs.forEach((c,id)=>{ if(c.day===dd&&(club==="all"||club===id)&&!S.regs.has(regId(d,id))) missing.push({date:d,day:dd,club:c.name,teacher:c.teacher||""}); }); }
  return {regs,rows,per,places,missing};
}

  const clubOpts=clubsSorted([...S.clubs.entries()]).map(([id,c])=>`<option value="${esc(id)}" ${p.club===id?"selected":""}>${c.day} · ${esc(c.name)} (${esc(c.yearsLabel)})</option>`).join("");
  return `<div class="viewhead"><div><h2>Absence report</h2><p>${fmtDate(p.from)} to ${fmtDate(p.to)}</p></div><button class="btn primary" data-act="exportrep">Export absence report</button></div>
  <div class="filters">
    <div class="seg" role="group" aria-label="Period">${[["today","Today"],["week","This week"],["month","This month"],["season","Season"]].map(([k,l])=>`<button data-act="rp" data-val="${k}" aria-pressed="${p.preset===k}">${l}</button>`).join("")}</div>
  </div>

  <div class="kpis">

    <div class="kpi"><div class="n">${D.per.length}</div><div class="l">Students absent</div></div>
    <div class="kpi"><div class="n">${rate==null?"–":rate+"%"}</div><div class="l">Attendance</div></div>

  <div class="grid2">

    <div class="panel"><h3>Every absence</h3>${D.rows.length?`<div class="tablewrap" style="max-height:480px"><table><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Club</th></tr></thead><tbody>${D.rows.slice().reverse().map(x=>`<tr><td style="white-space:nowrap">${dayChip(x.day)} ${fmtShort(x.date)}</td><td class="stu">${esc(x.name)}</td><td>${esc(x.cls)}</td><td>${esc(x.club)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Nothing recorded.</p>`}
    ${D.missing.length?`<details class="roster" style="margin-top:14px"><summary>${D.missing.length} registers not taken</summary><ol>${D.missing.slice(-200).reverse().map(m=>`<li>${fmtShort(m.date)} · ${esc(m.club)}</li>`).join("")}</ol></details>`:""}</div>
  </div>`;
}
async function exportReport(){
  if(typeof ExcelJS==="undefined"){ toast("The Excel tool didn't load. Reload the page and try again."); return; }
  const D=reportData(), p=S.rep;
  try{
    const wb=new ExcelJS.Workbook(); wb.creator="CCA Planner";
    const LINE="FFD5DCD9", INK="FF15211E";
    const border={top:{style:"thin",color:{argb:LINE}},bottom:{style:"thin",color:{argb:LINE}},left:{style:"thin",color:{argb:LINE}},right:{style:"thin",color:{argb:LINE}}};
    const head=row=>row.eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:INK}};c.border=border;});
    const sheet=(name,cols,rows)=>{ const ws=wb.addWorksheet(name,{views:[{state:"frozen",ySplit:1}]}); ws.columns=cols; head(ws.getRow(1)); rows.forEach(r=>ws.addRow(r).eachCell(c=>c.border=border)); ws.autoFilter={from:{row:1,column:1},to:{row:1,column:cols.length}}; return ws; };
    const filt=[p.cls!=="all"?`Class ${p.cls}`:"",p.club!=="all"?S.clubs.get(p.club)?.name:""].filter(Boolean).join(" · ")||"All classes and clubs";
    const sm=wb.addWorksheet("Summary",{views:[{showGridLines:false}]}); sm.columns=[{width:30},{width:40}];
    sm.getCell("A1").value="CCA absence report"; sm.getCell("A1").font={bold:true,size:16};
    [["Period",`${fmtDate(p.from)} – ${fmtDate(p.to)}`],["Filter",filt],["Registers taken",D.regs.length],["Absences",D.rows.length],["Students absent at least once",D.per.length],
     ["Attendance",D.places?`${Math.round(100*(D.places-D.rows.length)/D.places)}%`:"–"],["Registers not taken",D.missing.length],["Exported",new Date().toLocaleString("en-GB")]]
     .forEach(([k,v],i)=>{ const r=sm.getRow(3+i); r.values=[k,v]; r.getCell(1).font={bold:true}; });
    sheet("Absences",[{header:"Date",width:12},{header:"Day",width:11},{header:"Student",width:28},{header:"Class",width:8},{header:"Club",width:36},{header:"Teacher",width:18},{header:"Marked by",width:28}],
      D.rows.map(x=>[dateObj(x.date),DAYFULL[x.day]||x.day,x.name,x.cls,x.club,x.teacher,x.by])).getColumn(1).numFmt="dd mmm yyyy";

/* ---------- import bookings (CSV / Excel export from the booking system) ---------- */
const IMP_DAY = {sun:"Sun",sunday:"Sun",mon:"Mon",monday:"Mon",tue:"Tue",tues:"Tue",tuesday:"Tue",wed:"Wed",wednesday:"Wed",thu:"Thu",thur:"Thu",thurs:"Thu",thursday:"Thu"};
const normKey = s => String(s??"").toLowerCase().replace(/[^a-z0-9]+/g,"");
let IMP = null;

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){ row.push(f); f=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(f); f=""; if(row.some(v=>v.trim()!=="")) rows.push(row); row=[]; }
    else f+=ch;
  }
  row.push(f); if(row.some(v=>v.trim()!=="")) rows.push(row);
  return rows;
}
async function readSheetRows(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".csv")||file.type==="text/csv") return parseCSV(await file.text());
  if(!/\.xlsx$/.test(name)&&!/spreadsheetml/.test(file.type)) throw new Error("Pick the CSV or Excel (.xlsx) export from the booking system.");
  if(typeof ExcelJS==="undefined") throw new Error("The Excel tool didn't load. Reload the page and try again.");
  const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
  const ws=wb.worksheets.find(w=>w.rowCount>1)||wb.worksheets[0];
  if(!ws) throw new Error("That file has no sheets.");
  const rows=[]; ws.eachRow({includeEmpty:false},r=>{ const out=[]; for(let c=1;c<=r.cellCount;c++) out.push(String(r.getCell(c).text??"")); rows.push(out); });
  return rows;
}
function parseEvent(ev){
  const m=String(ev).trim().match(/^(.*?)\s*\(([A-Za-z]+)\)\s*-\s*(.*)$/); if(!m) return null;
  const day=IMP_DAY[m[2].toLowerCase()]; if(!day) return null;
  const rest=m[3]; const cut=rest.lastIndexOf(". ");
  const yearsTxt=cut>=0?rest.slice(0,cut):rest, teacher=cut>=0?rest.slice(cut+2).trim():"";
  const core=yearsTxt.split(/carried/i)[0];
  const nums=(core.match(/\d+/g)||[]).map(Number).filter(n=>n>=1&&n<=13);
  let years=[];
  if(nums.length>=2 && /\d\s*-\s*\d/.test(core)){ const lo=Math.min(nums[0],nums[1]),hi=Math.max(nums[0],nums[1]); for(let y=lo;y<=hi;y++) years.push(y); }
  else years=[...new Set(nums)].sort((a,b)=>a-b);
  return {name:m[1].trim(),day,teacher,years,notes:/carried over/i.test(yearsTxt)?"Carried over from Season 1":""};
}
function findClub(p){
  const all=[...S.clubs.entries()].filter(([,c])=>c.day===p.day&&normKey(c.name)===normKey(p.name));
  const byT=all.filter(([,c])=>normKey(c.teacher)===normKey(p.teacher));
  if(byT.length===1) return byT[0][0];
  const pool=byT.length?byT:all;
  const byY=pool.filter(([,c])=>p.years.length&&normKey((c.years||[]).join())===normKey(p.years.join()));
  if(byY.length===1) return byY[0][0];
  if(!byT.length&&all.length===1) return all[0][0];
  return null;
}

function buildImportPlan(rows){
  if(rows.length<2) throw new Error("That file is empty.");
  const head=rows[0].map(normKey);
  const col=n=>head.indexOf(normKey(n));
  const iE=col("Event"), iF=col("Student First Name"), iL=col("Student Surname"), iC=col("Student Class");
  if([iE,iF,iL,iC].some(i=>i<0)) throw new Error("This doesn't look like the bookings export. It needs the columns Event, Student First Name, Student Surname and Student Class.");
  const warn=[], newClubs=new Map(), evMap=new Map(), want=new Map(), seen=new Set();
  const stuByKey=new Map(); S.students.forEach((s,id)=>stuByKey.set(normKey(s.first)+"|"+normKey(s.last)+"|"+normKey(s.cls),id));
  let usedRows=0;
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; const ev=(row[iE]||"").trim(), first=(row[iF]||"").trim(), last=(row[iL]||"").trim();
    const cls=(row[iC]||"").trim().replace(/^class\s*/i,"").toUpperCase();
    if(!ev&&!first) continue;
    if(!ev||!first||!cls){ warn.push(`Row ${r+1} is missing a club, name or class, so it was skipped.`); continue; }
    if(!evMap.has(ev)){
      const p=parseEvent(ev);
      if(!p){ evMap.set(ev,null); warn.push(`Couldn't read the club “${ev}”. Its rows were skipped.`); }
      else {
        let cid=findClub(p);
        if(!cid){
          const lo=p.years.length?Math.min(...p.years):1, hi=p.years.length?Math.max(...p.years):1;
          cid=`${slugify(p.name)}-${p.day.toLowerCase()}-y${lo}${hi}`;
          if(S.clubs.has(cid)||newClubs.has(cid)) cid+=`-${Date.now().toString(36)}`;
          const years=p.years.length?p.years:[lo];
          newClubs.set(cid,{name:p.name,day:p.day,years,yearsLabel:yearsLabel(years),teacher:p.teacher,ta:"",location:"",capacity:null,notes:p.notes,stage:hi<=3?"KS1":(lo>=3?"KS2/3":"Mixed")});
        }
        evMap.set(ev,cid);
      }
    }
    const cid=evMap.get(ev); if(!cid) continue;
    const day=(S.clubs.get(cid)||newClubs.get(cid)).day;
    const key=normKey(first)+"|"+normKey(last)+"|"+normKey(cls);
    if(!want.has(key)) want.set(key,{first,last,cls,slots:{}});
    const w=want.get(key);
    if(w.slots[day]&&w.slots[day]!==cid) warn.push(`${first} ${last} is booked into two clubs on ${DAYFULL[day]}. The later row was used.`);
    w.slots[day]=cid; usedRows++;
  }
  const newStudents=[], changes=[];
  want.forEach((w,key)=>{
    const sid=stuByKey.get(key);
    if(!sid){
      let id=`${slugify(w.first+"-"+w.last)}-${slugify(w.cls)}`; if(S.students.has(id)) id+=`-${Date.now().toString(36)}`;
      newStudents.push({id,data:{first:w.first,last:w.last,cls:w.cls,notes:"",slots:Object.fromEntries(DAYS.map(d=>[d,w.slots[d]||null]))}});
      return;
    }
    seen.add(sid);
    const old=S.students.get(sid).slots||{}, diffs=[];
    DAYS.forEach(d=>{ const a=old[d]||null, b=w.slots[d]||null; if(a!==b) diffs.push({day:d,from:a,to:b}); });
    if(diffs.length) changes.push({sid,diffs});
  });
  const untouched=[...S.students.keys()].filter(id=>!seen.has(id)).length;
  return {fileRows:rows.length-1,usedRows,newClubs,newStudents,changes,warn,untouched};
}

const clubName = cid => { const c=S.clubs.get(cid)||IMP?.plan.newClubs.get(cid); return c?`${c.name}${c.yearsLabel?` (${c.yearsLabel})`:""}`:"No club"; };

  const nothing=!p.newClubs.size&&!p.newStudents.length&&!moves.length;

  openDrawer(`<div class="dhead"><div><h3>Import bookings</h3><p class="muted" style="margin:4px 0 0">${esc(IMP.fileName)} · ${p.fileRows} rows</p></div><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="dbody">
    <div class="legend"><span class="chip ${p.newClubs.size?"good":""}">${p.newClubs.size} new clubs</span><span class="chip ${p.newStudents.length?"good":""}">${p.newStudents.length} new students</span><span class="chip ${nMoves?"good":""}">${nMoves} club changes</span><span class="chip ${nClears?"warn":""}">${nClears} days cleared</span></div>
    ${nothing?`<div class="empty-state"><strong>Everything already matches</strong>The planner is up to date with this file.</div>`:""}
    ${p.warn.length?`<div class="banner" style="margin:0">${p.warn.slice(0,8).map(esc).join("<br>")}${p.warn.length>8?`<br>…and ${p.warn.length-8} more`:""}</div>`:""}
    <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer"><input type="checkbox" id="imp_keep" ${keep?"checked":""} style="margin-top:3px"><span><strong>Keep clubs on days the file leaves empty</strong><br><span class="muted" style="font-size:13px">Tick this if someone added a club by hand that isn't in the booking system yet.</span></span></label>
    ${p.newClubs.size?`<div class="field"><label>New clubs</label><div class="rosteredit">${[...p.newClubs.values()].map(c=>`<div class="r"><span><span class="day ${c.day}">${c.day}</span> <strong>${esc(c.name)}</strong> <span class="muted">${esc(c.yearsLabel)} · ${esc(c.teacher||"No teacher")}</span></span></div>`).join("")}</div><span class="muted" style="font-size:12.5px">Add their rooms and TAs on Locations &amp; staff afterwards.</span></div>`:""}
    ${p.newStudents.length?`<div class="field"><label>New students</label><div class="rosteredit">${p.newStudents.map(n=>`<div class="r"><span><strong>${esc(n.data.first)} ${esc(n.data.last)}</strong> <span class="muted">${esc(n.data.cls)} · ${DAYS.filter(d=>n.data.slots[d]).length} clubs</span></span></div>`).join("")}</div></div>`:""}
    ${moves.length?`<div class="field"><label>Changes for ${moves.length} students</label><div class="rosteredit">${moves.map(stuLine).join("")}</div></div>`:""}
    <p class="muted" style="margin:0;font-size:13px">${p.untouched} students in the planner aren't in this file and stay as they are. Nothing gets deleted.</p>
    <div id="impProg" role="status"></div>
  </div>
  <div class="dfoot"><span></span><div style="display:flex;gap:8px"><button class="btn" data-act="close">Cancel</button>${nothing?"":`<button class="btn primary" data-act="applyimport" id="impApply">Apply changes</button>`}</div></div>`);
  drawer={type:"import"};
  const k=$("#imp_keep"); if(k) k.addEventListener("change",()=>{ IMP.keepGaps=k.checked; importDrawer(); });
}

async function applyImport(){
  if(!IMP||IMP.busy||!S.db||!S.canWrite) return;
  IMP.busy=true;
  const p=IMP.plan, jobs=[];
  p.newClubs.forEach((data,id)=>jobs.push(()=>S.db.doc(`clubs/${id}`).set(data)));
  const clubJobs=jobs.length;
  p.newStudents.forEach(n=>jobs.push(()=>S.db.doc(`students/${n.id}`).set(n.data)));
  IMP.moves.forEach(c=>{ const slots={}; c.diffs.forEach(d=>slots[d.day]=d.to||null); jobs.push(()=>S.db.doc(`students/${c.sid}`).update({slots})); });
  const btn=$("#impApply"), prog=$("#impProg"); if(btn){ btn.disabled=true; }
  let done=0, failed=0;
  const tick=()=>{ if(prog) prog.innerHTML=`<div class="cap"><i style="width:${Math.round(done/jobs.length*100)}%"></i></div><span class="muted" style="font-size:13px">Saving ${done} of ${jobs.length}…</span>`; };
  const run=async list=>{ let i=0; const worker=async()=>{ while(i<list.length){ const fn=list[i++]; try{ await fn(); }catch(e){ failed++; if(e&&e.code==="invalid_argument"){ S.canWrite=false; } } done++; tick(); } }; await Promise.all(Array.from({length:Math.min(6,list.length)},worker)); };
  tick();
  await run(jobs.slice(0,clubJobs)); await run(jobs.slice(clubJobs));
  IMP.busy=false;
  if(!S.canWrite){ closeDrawer(); render(); toast("You don't have permission to edit this timetable."); return; }
  if(failed){ toast(`${jobs.length-failed} saved, ${failed} didn't. Upload the file again to finish.`); if(btn){ btn.disabled=false; } return; }
  closeDrawer(); const n=p.newStudents.length+IMP.moves.length; IMP=null; toast(`Updated ${n} students`+(p.newClubs.size?` and added ${p.newClubs.size} clubs`:""));
}

async function onImportFile(file){
  if(!file) return;
  if(!S.loaded.c||!S.loaded.s){ toast("The timetable is still loading. Try again in a moment."); return; }
  const btn=$("#importBtn"); btn.disabled=true;
  try{
    const rows=await readSheetRows(file);
    if(!drawer) importChooser();
    await runImport(rows,file.name);
  }catch(e){ toast(e&&e.message?e.message:"Couldn't read that file. Upload the CSV or Excel export from the booking system."); }
  finally{ btn.disabled=false; $("#importFile").value=""; }
}
function importChooser(){
  openDrawer(`<div class="dhead"><h3>Import bookings</h3><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="dbody">
    <label class="btn primary" for="importFile" style="justify-content:center">Upload Excel file</label>
    <div class="field"><label for="imp_paste">Or paste the rows from Excel</label><textarea id="imp_paste" rows="5"></textarea><button class="btn" data-act="importpaste" style="justify-content:center">Import pasted rows</button></div>
    <div id="impProg" role="status"></div>
  </div>`);
  drawer={type:"importpick"};
}
async function runImport(rows,name){
  IMP={fileName:name,plan:buildImportPlan(rows),keepGaps:false};
  const p=IMP.plan;
  IMP.moves=p.changes;
  if(!p.newClubs.size&&!p.newStudents.length&&!p.changes.length){ closeDrawer(); IMP=null; toast("Already up to date"); return; }
  await applyImport();
}
function importFromPaste(){
  const text=($("#imp_paste")?.value||"").replace(/^﻿/,"");
  if(!text.trim()){ toast("Paste the rows from the export first."); return; }
  if(!S.loaded.c||!S.loaded.s){ toast("The timetable is still loading. Try again in a moment."); return; }
  const rows=/\t/.test(text.split(/\r?\n/)[0])?text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split("\t")):parseCSV(text);
  runImport(rows,"Pasted rows").catch(e=>toast(e&&e.message?e.message:"Couldn't read those rows."));
}
$("#importBtn").addEventListener("click",importChooser);
$("#importFile").addEventListener("change",e=>onImportFile(e.target.files[0]));

/* ---------- boot ---------- */
setView(location.hash.slice(1)||"overview");
(async()=>{
  const cl=window.claude;
  if(!cl||!cl.use){ S.noDb=true; render(); return; }
  const [db,user,dl]=await Promise.all([cl.use("db"),cl.use("user"),cl.use("downloads")]);
  if(dl){ S.dl=dl; $("#exportBtn").hidden=false; }
  if(!db){ S.noDb=true; render(); return; }
  S.db=db;
  if(user){ try{ const w=await user.can("data.write"); if(w===false) S.canWrite=false; }catch(e){} }
  if(S.canWrite) $("#importBtn").hidden=false;
  const sub=(col,map,flag)=>db.collection(col).limit(1000).onSnapshot(snap=>{
    map.clear(); snap.docs.forEach(d=>map.set(d.id,d.data())); S.loaded[flag]=true;
    if(document.activeElement && document.activeElement.matches(".locin,.drawer *")) { if(!drawer) render(); return; }
    render();
  },err=>{ toast("Live updates stopped. Reload the page to reconnect."); });
  sub("clubs",S.clubs,"c"); sub("students",S.students,"s");
  db.collection("registers").limit(50000).onSnapshot(snap=>{ S.regs.clear(); snap.docs.forEach(d=>S.regs.set(d.id,d.data())); if(S.view==="attendance"||S.view==="report"){ if(document.activeElement&&document.activeElement.matches("input,select")) return; render(); } },()=>{});
})();
})();
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
